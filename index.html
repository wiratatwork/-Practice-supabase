<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Workflow Approve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['var(--font-family)', 'sans-serif'],
          },
          colors: {
            primary: 'var(--color-primary)',
            'primary-hover': 'var(--color-primary-hover)',
            'mint-bg': 'var(--color-bg)',
          }
        }
      }
    }
  </script>

  <div class="flex h-screen overflow-hidden">

      <!-- Page Content -->

        <div class="max-w-5xl mx-auto">

          <div class="flex flex-col items-center justify-center h-full text-gray-400 py-20">

  <script>
    var supabaseUrl = 'https://vpznydsmopelbydpvgtv.supabase.co';
    var supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwem55ZHNtb3BlbGJ5ZHB2Z3R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3ODk0NTUsImV4cCI6MjA5NjM2NTQ1NX0.0ISPuZQpBRMkWBbwt8yASEnPuDBBoKtNSchaKgQiPd4';
    var supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

    let currentUser = null;

    async function checkUser() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      currentUser = user;
      
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      
      // Initialize the global layout
      await initLayout(user, supabaseClient);
    }

    // เริ่มต้น
    checkUser();
